kind = "web"
previewPath = "/"
title = "Instituto Acaz Ribeiro"
version = "1.0.0"
id = "artifacts/acaz-clinic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25799

[services.development]
run = "pnpm --filter @workspace/acaz-clinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acaz-clinic", "run", "build" ]
publicDir = "artifacts/acaz-clinic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25799"
BASE_PATH = "/"
