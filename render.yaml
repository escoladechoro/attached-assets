services:
  - type: web
    name: attached-assets
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm -r --if-present run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attached-assets-db
          property: connectionString

databases:
  - name: attached-assets-db
    plan: free
